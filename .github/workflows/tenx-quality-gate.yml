name: TENX Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenx-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Verify server store fallback semantics
        run: npm run test:store

      - name: Verify severe alert state semantics
        run: npm run test:alerts

      - name: Validate production smoke script
        run: node --check scripts/smoke-production.mjs

      - name: Production build
        run: npm run build
